<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f8d9df;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{

background:#fffdf9;

border:12px solid #caa889;

border-radius:40px;

padding:60px;

max-width:700px;

text-align:center;

box-shadow:0 20px 40px rgba(0,0,0,.15);

}

.card h1{

font-family:'Great Vibes',cursive;

font-size:80px;

color:#9d775f;

}

.card p{

font-size:28px;

margin:25px 0;

color:#7b5c49;

line-height:1.7;

}

a{

display:inline-block;

margin-top:25px;

padding:18px 40px;

background:#efb4c2;

color:white;

border-radius:40px;

text-decoration:none;

font-family:'Montserrat',sans-serif;

font-weight:bold;

transition:.3s;

}

a:hover{

transform:scale(1.05);

background:#e59aac;

}

</style>

</head>

<body>

<div class="card">

<h1>

Thank You!

</h1>

<p>

Your RSVP has been received.

<br><br>

I can't wait to celebrate with you!

🤍

</p>

<a href="index.html">

Back to Invitation

</a>

</div>

</body>

</html>
